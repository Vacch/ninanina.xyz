# Copy this file to config.yaml and fill in your real data.
# config.yaml is gitignored so your personal details never get committed.

timezone: "Europe/Rome"

booking:
  url: "https://www.trippamilano.it/prenota-un-tavolo/"
  party_size: 2

  # The site uses a rolling window: every midnight, exactly one new date
  # unlocks - the day that is this many days ahead. 28 is what you observed;
  # change it here if that ever turns out to be off by one or the site
  # changes its policy.
  target_offset_days: 28

  # Times to try for that single newly-unlocked date, in priority order.
  # The bot asks the real booking API which of these are actually open and
  # goes for the first match. 19:15 (first turn) and 21:45 (second turn)
  # are the two dinner slots seen in a real capture - adjust to taste.
  preferred_times:
    - "19:15"
    - "21:45"

  # Captured from a real request while browsing with English as the
  # preferred browser language ("INGLESE" = Italian for "English"). This
  # might mean Trippa allocates a separate channel/quota per site language -
  # if you normally book in Italian, capture a HAR with Italian as the
  # primary Accept-Language and check whether ChannelCode differs there.
  channel_code: "INGLESE"

  # Weekdays Trippa is closed (currently Saturday and Sunday, per their
  # website). When the night's rollover would unlock a closed day, `run`
  # skips the wait entirely and just emails you a heads-up instead.
  # Double-check this list still matches trippamilano.it - restaurants do
  # change their closing days occasionally.
  closed_weekdays:
    - "Saturday"
    - "Sunday"

contact:
  first_name: "Stefano"
  last_name: "Vacchelli"
  email: "vacchelli.stefano@gmail.com"
  phone: "+39"
  notes: ""

schedule:
  # The window rolls over every night at this time.
  hour: 0
  minute: 0
  second: 0

  # Load the page this many seconds *before* the target time so it's warm
  # and logged in/ready, then busy-wait precisely until the target instant
  # before touching anything.
  prewarm_seconds_before: 30

  # After the target instant, keep retrying for this long in case the
  # widget lags behind the clock (e.g. slots appear a few seconds late).
  retry_window_seconds: 90
  retry_interval_seconds: 2

notifications:
  enabled: true
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: "youraddress@gmail.com"
  # Name of an environment variable holding a Gmail *app password*
  # (https://myaccount.google.com/apppasswords) - never put the password
  # in this file.
  smtp_password_env: "TRIPPA_BOT_SMTP_PASSWORD"
  to: "vacchelli.stefano@gmail.com"
